<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Magellan</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #flipbook {
      width: 1000px;
      height: 600px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    #flipbook .page {
      width: 500px;
      height: 600px;
      background: white;
      overflow: hidden;
    }

    #flipbook .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 48px;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      width: 60px;
      height: 80px;
      line-height: 80px;
      text-align: center;
      z-index: 1000;
      cursor: pointer;
      user-select: none;
      border-radius: 10px;
    }

    .left-arrow {
      left: 10px;
    }

    .right-arrow {
      right: 10px;
    }
  </style>
</head>

<body>

  <div id="flipbook"></div>
  <div class="nav-arrow left-arrow" onclick="$('#flipbook').turn('previous')">‹</div>
  <div class="nav-arrow right-arrow" onclick="$('#flipbook').turn('next')">›</div>


  <script src="js/jquery.min.js"></script>
  <script src="js/turn.min.js"></script>
  <script>
    var $fb = $('#flipbook');

    // Add a blank first page to force even layout from the beginning
    //$fb.append('<div class="page"></div>');

    for (var i = 0; i <= 244; i++) {
      var $page = $('<div />', { 'class': 'page' });
      var imgPath = 'images/0' + i + '.jpg';
      var img = $('<img />', { src: imgPath, alt: 'Page ' + i });
      img.on('error', function () {
        $(this).replaceWith('<div style="color:red;text-align:center;padding-top:40%;">Image missing</div>');
      });
      img.appendTo($page);
      $fb.append($page);
    }

    $fb.turn({
      width: 1000,
      height: 600,
      autoCenter: true,
      display: 'double',
      acceleration: true,
      gradients: true
    });


  </script>

</body>

</html>
